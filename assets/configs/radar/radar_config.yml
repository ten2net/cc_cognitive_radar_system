# 脉冲多普勒低慢小目标监视雷达配置文件
# 最后更新: 2025-08-04 wangf
radars:
  # 1. 基础型低空监视雷达
  PD-LS01:
    radar_type: "基础型低空监视雷达"
    frequency: [2.9e9, 2.915e9]  # X波段频率范围(Hz)
    pulse_width: 30e-6          # 脉冲宽度(s)
    tx_power: 500            # 发射功率(W)
    pulses: 128                # 脉冲个数
    prp: 200e-6                # 脉冲重复间隔(s)
    fs: 40e6                   # 采样率(Hz)
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)
    max_unambiguous_range: 30000 # 最大不模糊距离(m)
    max_unambiguous_speed: 75 # 最大不模糊速度(m/s)
    location: [0, 0, 0]        # 部署位置[x, y, z](m)
    speed: [0, 0, 0]           # 运动速度[vx, vy, vz](m/s)
    description: "用于一般低空区域监视，具备自适应MTI滤波能力"
  
  # 2. 机动型便携雷达
