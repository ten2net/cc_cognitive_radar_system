# 脉冲多普勒低慢小目标监视雷达配置文件
# 最后更新: 2025-08-04 wangf
radars:
  # 1. 基础型低空监视雷达
  PD-LS01:
    radar_type: "基础型低空监视雷达"
    frequency: [2.9e9, 2.915e9]  # X波段频率范围(Hz)
    pulse_width: 30e-6          # 脉冲宽度(s)
    tx_power: 500            # 发射功率(W)
    pulses: 128                # 脉冲个数
    prp: 200e-6                # 脉冲重复间隔(s)
    fs: 40e6                   # 采样率(Hz)
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)
    max_unambiguous_range: 30000 # 最大不模糊距离(m)
    max_unambiguous_speed: 75 # 最大不模糊速度(m/s)
    location: [0, 0, 0]        # 部署位置[x, y, z](m)
    speed: [0, 0, 0]           # 运动速度[vx, vy, vz](m/s)
    description: "用于一般低空区域监视，具备自适应MTI滤波能力"
  
  # 2. 机动型便携雷达
  PD-LS02:
    radar_type: "机动型便携雷达"
    frequency: [15.2e9, 15.7e9]  # Ku波段（15.45 GHz中心频率）非常适合无人机探测。波长约为1.94 cm，对小型目标有良好的反射特性。频率范围500 MHz用于带宽，合理。提供0.3米的距离分辨率，这对于区分近距离的多个无人机非常有利。设置合理。
    pulse_width: 10e-6 # 短脉冲宽度，距离盲区小（约300米），与带宽匹配良好（时间带宽积=500e6 * 2e-6=1000，足够大）。合理。
    tx_power: 100   # 100 W的发射功率对于中程监视雷达是合适的。但要注意，高增益天线会聚焦能量，实际辐射功率会增强，需符合法规。
    pulses: 256                 # 脉冲个数    
    prp: 100e-6  # 最大不模糊距离：约15 km（c/(2*PRF)=3e8/(2 * 10000)=15000米），适合中程无人机监视。
    fs: 1000e6  # 1 GHz采样率满足500 MHz带宽的奈奎斯特采样要求（至少需要1倍带宽，但通常取2倍以上，这里2倍带宽）。合理。
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 7500
    max_unambiguous_speed: 47.4
    location: [0, 0, 0]
    speed: [0, 0, 0]
    description: "50kg级便携式设计，快速部署能力"
  
  # 3. 高分辨率城市雷达
  PD-LS03:
    radar_type: "高分辨率城市监控雷达"
    frequency: [13.5e9, 14e9]  # Ku波段频率范围(Hz)
    pulse_width: 0.2e-6
    tx_power: 500
    pulses: 32                 # 脉冲个数    
    prp: 20e-6
    fs: 100e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 3000
    max_unambiguous_speed: 275
    location: [100, 80, 50]
    speed: [0, 0, 0]
    description: "专为城市环境优化，具备建筑物多径抑制算法"
  
  # 4. 长程低空预警雷达
  PD-LS04:
    radar_type: "长程低空预警雷达"
    frequency: [1.2e9, 1.4e9]  # L波段频率范围(Hz)
    pulse_width: 10e-6
    tx_power: 500
    pulses: 32                 # 脉冲个数    
    prp: 500e-6
    fs: 5e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 75000
    max_unambiguous_speed: 115
    location: [0, 0, 30]
    speed: [0, 0, 0]
    description: "远程低空监视，气象杂波抑制能力"
  
  # 5. 反无人机专用雷达
  PD-LS05:
    radar_type: "反无人机专用雷达"
    frequency: [5.4e9, 5.9e9]  # C波段频率范围(Hz)
    pulse_width: 0.1e-6
    tx_power: 80
    pulses: 32                 # 脉冲个数    
    prp: 100e-6
    fs: 200e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 15000
    max_unambiguous_speed: 135
    location: [50, 50, 10]
    speed: [0, 0, 0]
    description: "微型无人机探测，微多普勒特征识别技术"
  
  # 6. 海岸监视雷达
  PD-LS06:
    radar_type: "海岸监视雷达"
    frequency: [3.0e9, 3.2e9]  # S波段频率范围(Hz)
    pulse_width: 5e-6
    tx_power: 150
    pulses: 32                 # 脉冲个数    
    prp: 300e-6
    fs: 15e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 45000
    max_unambiguous_speed: 83.3
    location: [0, 0, 20]
    speed: [0, 0, 0]
    description: "海杂波自适应抑制，抗盐雾腐蚀设计"
  
  # 7. 低功耗边境巡逻雷达
  PD-LS07:
    radar_type: "低功耗边境巡逻雷达"
    frequency: [3.0e9, 3.2e9]  # S波段频率范围(Hz)
    pulse_width: 2e-6
    tx_power: 100
    pulses: 32                 # 脉冲个数    
    prp: 1e-3
    fs: 10e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 150000
    max_unambiguous_speed: 25
    location: [0, 0, 5]
    speed: [0, 0, 0]
    description: "太阳能供电，低截获概率运行模式"
  
  # 8. 机场跑道监控雷达
  PD-LS08:
    radar_type: "机场跑道监控雷达"
    frequency: [9.3e9, 9.7e9]  # X波段频率范围(Hz)
    pulse_width: 0.8e-6
    tx_power: 50
    pulses: 32                 # 脉冲个数    
    prp: 250e-6
    fs: 30e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 37500
    max_unambiguous_speed: 31.6
    location: [0, 0, 10]
    speed: [0, 0, 0]
    description: "跑道入侵实时告警，符合ICAO Annex 14标准"
  
  # 9. 多功能战术雷达
  PD-LS09:
    radar_type: "多功能战术雷达"
    frequency: [5.0e9, 6.0e9]  # C波段频率范围(Hz)
    pulse_width: 5e-6           # 默认脉宽
    tx_power: 200
    pulses: 32                 # 脉冲个数    
    prp: 200e-6                 # 默认prp
    fs: 60e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 15000
    max_unambiguous_speed: 135
    location: [0, 0, 15]
    speed: [10, 0, 0]
    description: "支持SAR成像模式，电子对抗(ECCM)能力"
  
  # 10. 微型无人机探测雷达
  PD-LS10:
    radar_type: "微型无人机探测雷达"
    frequency: [34e9, 36e9]     # Ka波段频率范围(Hz)
    pulse_width: 0.05e-6
    tx_power: 500
    pulses: 32                 # 脉冲个数    
    prp: 40e-6
    fs: 400e6
    rf_gain: 30                # 总RF增益 (dB)
    baseband_gain: 40          # 基带增益 (dB)    
    max_unambiguous_range: 6000
    max_unambiguous_speed: 53.75
    location: [0, 0, 5]
    speed: [0, 0, 0]
    description: "微型化设计，深度学习目标分类"
# 雷达环境配置
environment:
  env_name: "CognitiveRadar-v1"
  max_steps: 1000

# 训练配置
training:
  iterations: 1000
  episodes_per_iteration: 10
  num_envs: 4
  save_interval: 100

# 网络架构配置
network:
  hidden_dims: [256, 128]
  activation: "elu"

# PPO算法参数
algorithm:
  learning_rate: 3e-4
  clip_range: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 1.0
  gamma: 0.99
  lam: 0.95
  num_mini_batches: 8
  num_learning_epochs: 5

# 雷达系统参数
radar:
  frequency: 24e9  # 24 GHz
  bandwidth: 500e6  # 500 MHz
  prf: 10e3  # 10 kHz
  pulse_width: 1e-6  # 1 μs
  antenna_gain: 30  # 30 dBi
  noise_figure: 3  # 3 dB

# 目标参数
targets:
  min_rcs: 0.1  # 最小雷达截面积 (m²)
  max_rcs: 10.0  # 最大雷达截面积 (m²)
  min_speed: 5.0  # 最小速度 (m/s)
  max_speed: 100.0  # 最大速度 (m/s)
  min_distance: 50.0  # 最小距离 (m)
  max_distance: 2000.0  # 最大距离 (m)

# 奖励函数权重
rewards:
  detection_weight: 1.0
  false_alarm_penalty: -0.5
  energy_penalty: -0.01
  tracking_weight: 0.5
  classification_weight: 0.2

# 观测空间配置
observation:
  rd_map_shape: [64, 64]  # RD图分辨率
  feature_dim: 10  # 特征向量维度
  normalize: true  # 是否归一化观测值

# 动作空间配置
action:
  beam_control_range: [-30, 30]  # 波束控制角度范围 (度)
  waveform_params_range:  # 波形参数范围
    prf: [1e3, 20e3]  # PRF范围 (Hz)
    pulse_width: [0.1e-6, 10e-6]  # 脉冲宽度范围 (s)
    bandwidth: [10e6, 1000e6]  # 带宽范围 (Hz)
  gain_control_range: [0, 1]  # 增益控制范围

# 评估配置
evaluation:
  num_episodes: 5
  render: true
  save_video: false
  video_path: "videos/"

# 日志配置
logging:
  log_dir: "logs/"
  tensorboard: true
  verbose: true    